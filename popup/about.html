            .header {
                align-items: center;
                padding: 10px 4px;
                display: flex;
                gap: 10px;
            }

            .header div {
                transform: translateY(-3px);
            }

            .header img {
                height: 60px;
            }

            .header span {
                font-size: 1.32em;
            }

            .header h1 {
                font-size: 1.8em;
                font-weight: 500;
                margin: 0 0 2px;
            }

            .footer {
                width: calc(100vw - 20px);
                background: #f0f0f0;
                text-align: center;
                padding: 10px;
                height: 100vh;
            }

            .footer p {
                margin: 7px;

            }

        <div class="header">
            <img src="../img/90.png">
