<html>
    <head>
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="winui.css">
        <link rel="stylesheet" href="themes/classic.css" id="theme">

        <title class="version">Extreme Injector v{VERSION} by shadowocto</title>
    </head>
    <body>
        <div class="title-bar">
            <img src="../img/90.png">
            <span class="version">Extreme Injector v{VERSION} by shadowocto</span>
        </div>
        <div class="content">
            <fieldset>
                <legend>Inject List</legend>

                <div class="buttons">
                    <button id="add">Add Sprite</button>
                    <button id="toggle">Enable/Disable</button>
                    <button id="remove">Remove</button>
                    <button id="clear">Clear</button>
                </div>

                <div class="table">
                    <table id="sprite-table">
                        <tr>
                            <th></th>
                            <th>Sprite Name</th>
                            <th></th>
                        </tr>
                    </table>
                </div>
            </fieldset>

            <div class="buttons">
                <button id="about">About</button>
                <button id="settings">Settings</button>
                <button id="inject" disabled>Inject</button>
            </div>
        </div>

        <script src="js/settings.js"></script>
        <script src="js/util.js"></script>
        <script src="js/ui.js"></script>
    </body>
</html>
